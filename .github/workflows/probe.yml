name: Probe interfaces

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "sources.yaml"
      - "scripts/**"
      - ".github/workflows/probe.yml"

concurrency:
  group: probe-interfaces
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe sources
        run: python3 scripts/probe.py

      - name: Update history
        run: python3 scripts/history.py

      - name: Check mirrors
        run: python3 scripts/mirrors.py

      - name: Merge official config
        env:
          KEEP_NETDISK: ${{ vars.KEEP_NETDISK }}
          ONLY_CMS: ${{ vars.ONLY_CMS }}
        run: python3 scripts/merge.py

      - name: Build dist and dashboard data
        run: python3 scripts/build.py

      - name: Notify on status change
        continue-on-error: true
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_ON: ${{ vars.ALERT_ON }}
        run: python3 scripts/notify.py

      - name: Commit dist
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ docs/data/
          if git diff --staged --quiet; then
            echo "No dist changes"
            exit 0
          fi
          git commit -m "chore: update probe results"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected, rebase keeping local dist ($i/5)..."
            git fetch origin main
            if ! git rebase origin/main; then
              # Generated artifacts: keep this run's dist over remote.
              git checkout --theirs -- dist/ docs/data/
              git add dist/ docs/data/
              GIT_EDITOR=true git rebase --continue
            fi
            sleep $((i * 2))
          done
          echo "Failed to push after retries"
          exit 1
